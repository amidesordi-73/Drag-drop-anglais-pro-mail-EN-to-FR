<script>

const items = document.querySelectorAll('.item');
const dropzones = document.querySelectorAll('.dropzone');
const englishColumn = document.querySelectorAll('.column')[1];

let draggedItem = null;

// Drag des éléments
document.addEventListener('dragstart', (e) => {

    if(e.target.classList.contains('item')){
        draggedItem = e.target;
    }

});

// Autorise le drop dans les zones françaises
dropzones.forEach(zone => {

    zone.addEventListener('dragover', (e) => {
        e.preventDefault();
    });

    zone.addEventListener('drop', (e) => {

        e.preventDefault();

        // Si une autre réponse est déjà présente,
        // on la renvoie dans la colonne de droite
        const existingItem = zone.querySelector('.item');

        if(existingItem){
            englishColumn.appendChild(existingItem);
        }

        zone.appendChild(draggedItem);

        // Nettoyage des couleurs
        zone.classList.remove('correct', 'wrong');

    });

});

// Permet de remettre les réponses dans la colonne de droite
englishColumn.addEventListener('dragover', (e) => {
    e.preventDefault();
});

englishColumn.addEventListener('drop', (e) => {

    e.preventDefault();

    if(draggedItem){
        englishColumn.appendChild(draggedItem);
    }

});

// Vérification
function checkAnswers(){

    let score = 0;

    dropzones.forEach(zone => {

        const item = zone.querySelector('.item');

        zone.classList.remove('correct','wrong');

        if(item){

            if(item.textContent.trim() === zone.dataset.answer){

                zone.classList.add('correct');
                score++;

            }else{

                zone.classList.add('wrong');

            }

        }else{

            zone.classList.add('wrong');

        }

    });

    document.getElementById('score').innerHTML =
        "Score : " + score + " / " + dropzones.length;
}

</script>
